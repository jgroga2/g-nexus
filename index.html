<!DOCTYPE html>
<html lang="fr" class="scroll-smooth bg-obsidian text-ivory selection:bg-champagne selection:text-obsidian">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>G. NEXUS — Business Protector | Gestion des Risques & Enquêtes (STANDALONE)</title>
    <meta name="description" content="Cabinet de conseil indépendant d'élite spécialisé dans la gestion des risques stratégiques, l'investigation interne et la résilience opérationnelle sous haute pression (Méthode ORFA). Dirigé par Jean Groga." />

    <!-- React & ReactDOM CDN -->

    <!-- Babel for In-Browser JSX compiling -->

    <style type="text/css">
      body {
        background-color: #080D14;
        color: #FAF6F0;
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
      }
      .noise-overlay::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.025;
        z-index: 9999;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #080D14;
      }
      ::-webkit-scrollbar-thumb {
        background: #121a24;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C5A880;
      }
      @keyframes shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }
      .magnetic-btn {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .magnetic-btn:hover {
        transform: scale(1.02);
      }
      .shimmer-btn {
        position: relative;
        overflow: hidden;
      }
      .shimmer-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(197, 168, 128, 0.2),
          transparent
        );
        transition: none;
      }
      .shimmer-btn:hover::after {
        animation: shimmer 1.5s infinite;
      }
      .lift-hover {
        transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .lift-hover:hover {
        transform: translateY(-2px);
      }
      .glass-container {
        background: linear-gradient(135deg, rgba(8, 13, 20, 0.6) 0%, rgba(4, 6, 10, 0.4) 100%);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(197, 168, 128, 0.08);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02), 0 10px 40px rgba(0, 0, 0, 0.6);
        transition: border-color 0.5s ease, box-shadow 0.5s ease;
      }
      .ambient-glow {
        position: absolute;
        border-radius: 9999px;
        pointer-events: none;
        filter: blur(140px);
        z-index: 0;
        opacity: 0.12;
        mix-blend-mode: screen;
      }
      .feature-card {
        transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .feature-card:hover {
        border-color: rgba(197, 168, 128, 0.22);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.04), 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(197, 168, 128, 0.03);
      }
      .bg-dots {
        background-image: radial-gradient(rgba(197, 168, 128, 0.05) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .grid-line-h {
        height: 0.5px;
        background-color: rgba(197, 168, 128, 0.08);
        width: 100%;
      }
      .grid-line-v {
        width: 0.5px;
        background-color: rgba(197, 168, 128, 0.08);
        height: 100%;
      }
    </style>
  </head>
  <body class="overflow-x-hidden antialiased noise-overlay">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useRef, useState } = React;

      // Inline Icons
      const LogoSymbol = ({ className }) => (
        <svg className={className} viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="1.6">
          <path d="M 76 35 A 30 30 0 1 0 80 50 L 50 50" strokeLinecap="round" strokeLinejoin="round" />
          <circle cx="50" cy="50" r="3" fill="currentColor" />
          <line x1="15" y1="80" x2="85" y2="80" strokeLinecap="round" />
        </svg>
      );

      const SparkleIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2 C12 7.5 16.5 12 22 12 C16.5 12 12 16.5 12 22 C12 16.5 7.5 12 2 12 C7.5 12 12 7.5 12 2 Z" />
        </svg>
      );

      const SearchIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8" />

      const CheckIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      );

      const TerminalIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">

      const ActivityIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">

      );

      const ArrowUpRightIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="7" y1="17" x2="17" y2="7" />

      );

      const UserCheckIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="8.5" cy="7" r="4" />
          <polyline points="17 11 19 13 23 9" />
        </svg>
      );

      const LockIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      );

      const XIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      );

      const CalendarIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
      );

      const ClockIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      );

      const GlobeIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
      );

      const ChevronRightIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      );

      const ChevronLeftIcon = ({ className }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      );

      function App() {
        const containerRef = useRef(null);
        const heroRef = useRef(null);
        const navRef = useRef(null);
        const philosophyRef = useRef(null);
        const protocolContainerRef = useRef(null);
        
        // Custom states for Interactive Features
        const [investigationStack, setInvestigationStack] = useState([
          { id: 'inv-1', title: 'Audit Sapin II', desc: 'Enquête de probité interne - Retail Group', code: 'SEC-290-A', status: 'Actif' },
          { id: 'inv-2', title: 'Tracing Financier', desc: 'Recherche actifs offshore - Contentieux', code: 'ASST-104-X', status: 'Résolu' },
          { id: 'inv-3', title: 'Due Diligence M&A', desc: 'Background check de probité - Énergie', code: 'DD-881-Z', status: 'Clôturé' }
        ]);

        const [telemetryLogs, setTelemetryLogs] = useState([]);
        const [typedText, setTypedText] = useState('');
        const logSequence = [
          'Scan initial Target-Alpha (Dakar, SN)... OK',
          'Vérification registres commerciaux... Terminé',
          'Contrôle des liens de probité... Conforme',
          'Audit de risque réputationnel... Conforme',
          'Status: CERTIFICAT DE COMPLIANCE ÉMIS',
          '--------------------------------------',
          'Scan initial Partner-Bravo (Abidjan, CI)... OK',
          'Analyse des structures locales... En cours',
          'Warning: Anomalie détectée chaîne de sous-traitance',
          'Liaison terrain établie... Protocole de levée de doute',
          'Rapport rédigé sous secret professionnel.'
        ];
        
        const [schedulerDays, setSchedulerDays] = useState([
          { name: 'L', active: false },
          { name: 'M', active: false },
          { name: 'M', active: false },
          { name: 'J', active: false },
          { name: 'V', active: false },
          { name: 'S', active: false },
          { name: 'D', active: false }
        ]);
        const [cursorPos, setCursorPos] = useState({ x: 50, y: 150 });
        const [cursorOpacity, setCursorOpacity] = useState(0);
        const [isClicking, setIsClicking] = useState(false);
        const [schedulerStatus, setSchedulerStatus] = useState('ORFA inactif');

        // Floating navbar scroll effect
        const [scrolled, setScrolled] = useState(false);

        // Booking Flow States
        const [isBookingOpen, setIsBookingOpen] = useState(false);
        const [bookingStep, setBookingStep] = useState(1); // 1: Questionnaire, 2: Calendar, 3: Success
        const [selectedService, setSelectedService] = useState('due-diligence');
        const [urgencyLevel, setUrgencyLevel] = useState('preventive');
        const [geography, setGeography] = useState('europe');
        const [selectedDate, setSelectedDate] = useState(null);
        const [selectedTimeSlot, setSelectedTimeSlot] = useState(null);
        const [contactInfo, setContactInfo] = useState({ name: '', email: '', phone: '' });

        // Generate dates for current month booking (June 2026)
        const daysInMonth = Array.from({ length: 30 }, (_, i) => i + 1);
        const timeSlots = ['09:00', '10:30', '14:00', '15:30', '17:00'];

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 80);
          };
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        // 1. Cycle logic for Card 1
        useEffect(() => {
          const interval = setInterval(() => {
            setInvestigationStack((prev) => {
              const next = [...prev];
              const last = next.pop();
              next.unshift(last);
              return next;
            });
          }, 3000);
          return () => clearInterval(interval);
        }, []);

        // 2. Typewriter logic for Card 2
        useEffect(() => {
          let currentLineIndex = 0;
          let currentCharIndex = 0;
          let currentText = '';
          let isWaiting = false;

          const type = () => {
            if (isWaiting) return;
            const currentFullLine = logSequence[currentLineIndex];
            if (currentCharIndex < currentFullLine.length) {
              currentText += currentFullLine.charAt(currentCharIndex);
              setTypedText(currentText);
              currentCharIndex++;
            } else {
              isWaiting = true;
              setTimeout(() => {
                setTelemetryLogs(prev => {
                  const updated = [...prev, currentText];
                  if (updated.length > 4) updated.shift();
                  return updated;
                });
                currentText = '';
                setTypedText('');
                currentCharIndex = 0;
                currentLineIndex = (currentLineIndex + 1) % logSequence.length;
                isWaiting = false;
              }, 1500);
            }
          };

          const interval = setInterval(type, 30);
          return () => clearInterval(interval);
        }, []);

        // 3. Automated schedule clicking animation loop
        useEffect(() => {
          let step = 0;
          const runSchedulerAnimation = () => {
            if (step === 0) {
              setCursorOpacity(1);
              setCursorPos({ x: 30, y: 125 });
              setSchedulerStatus('Recherche créneau...');
              setTimeout(() => {
                setCursorPos({ x: 95, y: 70 });
                step = 1;
              }, 800);
            } else if (step === 1) {
              setIsClicking(true);
              setTimeout(() => {
                setIsClicking(false);
                setSchedulerDays(prev => prev.map((d, i) => i === 2 ? { ...d, active: true } : d));
                setSchedulerStatus('Créneau Mercredi réservé');
                step = 2;
              }, 300);
            } else if (step === 2) {
              setTimeout(() => {
                setCursorPos({ x: 175, y: 70 });
                step = 3;
              }, 1000);
            } else if (step === 3) {
              setIsClicking(true);
              setTimeout(() => {
                setIsClicking(false);
                setSchedulerDays(prev => prev.map((d, i) => i === 4 ? { ...d, active: true } : d));
                setSchedulerStatus('Créneau Vendredi réservé');
                step = 4;
              }, 300);
            } else if (step === 4) {
              setTimeout(() => {
                setCursorPos({ x: 235, y: 125 });
                step = 5;
              }, 1000);
            } else if (step === 5) {
              setIsClicking(true);
              setTimeout(() => {
                setIsClicking(false);
                setSchedulerStatus('Protocole validé ✔');
                step = 6;
              }, 300);
            } else if (step === 6) {
              setTimeout(() => {
                setCursorOpacity(0);
                setTimeout(() => {
                  setSchedulerDays(prev => prev.map(d => ({ ...d, active: false })));
                  setSchedulerStatus('ORFA inactif');
                  step = 0;
                }, 1000);
              }, 2000);
            }
          };

          const interval = setInterval(runSchedulerAnimation, 500);
          return () => clearInterval(interval);
        }, []);

        // GSAP Animations
        useEffect(() => {
          const ctx = gsap.context(() => {
            gsap.fromTo('.hero-animate', 
              { y: 30, opacity: 0 },
              { y: 0, opacity: 1, duration: 1.5, stagger: 0.12, ease: 'power3.out' }
            );

            gsap.fromTo('.feature-card',
              { y: 40, opacity: 0 },
              {
                y: 0,
                opacity: 1,
                duration: 1.2,
                stagger: 0.15,
                ease: 'power3.out',
                scrollTrigger: {
                  trigger: '.features-trigger',
                  start: 'top 85%',
                  toggleActions: 'play none none none'
                }
              }
            );

            const chars = document.querySelectorAll('.philosophy-word');
            if (chars.length > 0) {
              gsap.fromTo(chars,
                { y: 15, opacity: 0 },
                {
                  y: 0,
                  opacity: 1,
                  duration: 1,
                  stagger: 0.04,
                  ease: 'power3.out',
                  scrollTrigger: {
                    trigger: '.philosophy-trigger',
                    start: 'top 80%',
                    toggleActions: 'play none none none'
                  }
                }
              );
            }

            const protocolCards = gsap.utils.toArray('.protocol-card');
            if (protocolCards.length > 0) {
              protocolCards.forEach((card, index) => {
                if (index < protocolCards.length - 1) {
                  gsap.to(card, {
                    scale: 0.93,
                    opacity: 0.35,
                    filter: 'blur(8px)',
                    scrollTrigger: {
                      trigger: protocolCards[index + 1],
                      start: 'top 80%',
                      end: 'top 20%',
                      scrub: true
                    }
                  });
                }
              });
            }
          }, containerRef);

          return () => ctx.revert();
        }, []);

        const openBooking = () => {
          setIsBookingOpen(true);
          setBookingStep(1);
          document.body.style.overflow = 'hidden';
        };

        const closeBooking = () => {
          setIsBookingOpen(false);
          document.body.style.overflow = 'auto';
        };

        const handleBookingSubmit = (e) => {
          e.preventDefault();
          if (!contactInfo.name || !contactInfo.email) return;
          setBookingStep(3); // Go to success step
        };

        return (
          <div ref={containerRef} className="min-h-screen relative text-ivory overflow-hidden bg-obsidian">
            
            {/* A. NAVBAR — "L'Île Flottante" */}
            <nav 
              ref={navRef}
              className={`fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-500 w-[90%] max-w-4xl rounded-full ${
                scrolled 
                  ? 'glass-container py-2.5 px-6 shadow-2xl border-champagne/10 bg-obsidian/80' 
                  : 'bg-transparent py-4 px-6 border-transparent'
              }`}
            >
              <div className="flex items-center justify-between w-full">
                <a href="#hero" className="flex items-center gap-2.5 group cursor-pointer">
                  <LogoSymbol className="w-6 h-6 text-champagne group-hover:scale-105 transition-transform duration-300" />
                  <span className="font-serif font-medium tracking-[0.15em] text-sm text-ivory">G. NEXUS</span>
                </a>

                <div className="hidden md:flex items-center gap-8">
                  <a href="#services" className="text-[10px] font-sans uppercase tracking-[0.2em] text-ivory/50 hover:text-champagne transition-colors duration-200 lift-hover">Piliers</a>
                  <a href="#manifeste" className="text-[10px] font-sans uppercase tracking-[0.2em] text-ivory/50 hover:text-champagne transition-colors duration-200 lift-hover">Manifeste</a>
                  <a href="#protocole" className="text-[10px] font-sans uppercase tracking-[0.2em] text-ivory/50 hover:text-champagne transition-colors duration-200 lift-hover">Protocole</a>
                </div>

                <button 
                  onClick={openBooking}
                  className="magnetic-btn shimmer-btn border border-champagne/30 text-champagne px-4 py-1.5 rounded-full text-[10px] font-sans uppercase tracking-[0.15em] hover:bg-champagne hover:text-obsidian hover:border-champagne"
                >
                  <span className="relative z-10 flex items-center gap-1.5">
                    Prendre RDV <ArrowUpRightIcon className="w-3 h-3" />
                  </span>
                </button>
              </div>
            </nav>

            {/* B. SECTION HERO — "Le Plan d'Ouverture" */}
            <section 
              id="hero"
              ref={heroRef}
              className="relative min-h-[600px] h-screen w-full flex items-center md:items-end justify-start pt-24 pb-16 md:pb-24 px-6 md:px-16 overflow-hidden bg-cover bg-center"
              style={{
                backgroundImage: `url('./hero-bg.jpg')`
              }}
            >
              {/* Layer Gradient Overlay */}
              <div className="absolute inset-0 bg-gradient-to-t from-obsidian via-[#080d14]/85 to-[#080d14]/40 z-0"></div>
              
              {/* Ambient Glow Spots */}
              <div className="absolute top-[25%] left-[12%] w-[350px] h-[350px] bg-champagne/10 rounded-full blur-[140px] pointer-events-none z-0 mix-blend-screen"></div>
              <div className="absolute bottom-[20%] right-[8%] w-[450px] h-[450px] bg-[#1a2d42]/30 rounded-full blur-[160px] pointer-events-none z-0 mix-blend-screen"></div>

              {/* Architectural Fine Lines echoing the background geometry */}
              <div className="absolute inset-0 z-0 pointer-events-none overflow-hidden">
                <div className="absolute left-[8%] md:left-[12%] top-0 bottom-0 w-[0.5px] bg-champagne/15"></div>
                <div className="absolute left-[70%] top-0 bottom-0 w-[0.5px] bg-champagne/15 hidden md:block"></div>
                <div className="absolute left-0 right-0 top-[28%] h-[0.5px] bg-champagne/15"></div>
                <div className="absolute left-0 right-0 bottom-[22%] h-[0.5px] bg-champagne/15"></div>
              </div>

              {/* Telemetry Operational Overlay */}

                      <li><a href="#protocole" className="hover:text-champagne transition-colors">Protocole</a></li>
                    </ul>
                  </div>

                  <div>
                    <h4 className="font-sans font-normal text-[10px] uppercase tracking-[0.2em] text-champagne mb-4">Légal</h4>
                    <ul className="space-y-2 text-[10px] font-light text-ivory/50">
                      <li><a href="#" className="hover:text-champagne transition-colors">Mentions Légales</a></li>
                      <li><a href="#" className="hover:text-champagne transition-colors">Politique RGPD</a></li>
                      <li><a href="#" className="hover:text-champagne transition-colors">Déontologie OPJ</a></li>
                      <li><a href="#" className="hover:text-champagne transition-colors">Secret Professionnel</a></li>
                    </ul>
                  </div>
                </div>

                <div className="border-t border-ivory/5 pt-8 flex flex-col md:flex-row justify-between items-center gap-4 text-left">
                  <span className="font-mono text-[8px] text-ivory/30">
                    © {new Date().getFullYear()} G. NEXUS. TOUS DROITS RÉSERVÉS. CODE DE DÉONTOLOGIE OPJ APPLICABLE.
                  </span>
                  <span className="font-mono text-[8px] text-ivory/30">
                    DESIGNED FOR ELITE SECURITY // EUROPE - AFRIQUE
                  </span>
                </div>

              </div>
            </footer>

            {/* H. INTERACTIVE BOOKING FLOW MODAL */}
            {isBookingOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/90 backdrop-blur-md transition-opacity duration-300">
                
                <div className="relative w-full max-w-2xl bg-[#090e15] border border-champagne/20 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col max-h-[90vh] text-ivory">
                  
                  {/* Modal Header */}
                  <div className="flex items-center justify-between px-8 py-5 border-b border-champagne/15 bg-[#0c121d]">
                    <div className="flex items-center gap-2">
                      <CalendarIcon className="w-4 h-4 text-champagne" strokeWidth={1.5} />
                      <span className="font-serif font-medium uppercase tracking-[0.18em] text-xs text-ivory">
                        {bookingStep === 1 && '1. Diagnostic du Mandat'}
                        {bookingStep === 2 && '2. Planification Consultation'}
                        {bookingStep === 3 && 'Confirmation de la demande'}
                      </span>
                    </div>
                    <button 
                      onClick={closeBooking}
                      className="text-ivory/50 hover:text-champagne transition-colors"
                    >
                      <XIcon className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Modal Body */}
                  <div className="flex-1 overflow-y-auto p-8 text-left text-ivory/95 bg-[#090e15]/50">
                    
                    {/* STEP 1: Diagnostic Questionnaire */}
                    {bookingStep === 1 && (
                      <div className="space-y-6">
                        <div>
                          <h3 className="text-xs font-serif font-semibold uppercase tracking-wider text-champagne mb-3">Quel est le périmètre principal de votre demande ?</h3>
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <button 
                              onClick={() => setSelectedService('due-diligence')}
                              className={`p-4 rounded-xl border text-left transition-all flex flex-col justify-between ${
                                selectedService === 'due-diligence' 
                                  ? 'bg-[#0c121d] border-2 border-champagne text-ivory shadow-lg shadow-champagne/5' 
                                  : 'bg-obsidian/40 border border-champagne/15 text-ivory/60 hover:border-champagne/40 hover:text-ivory hover:shadow-md'
                              }`}
                            >
                              <GlobeIcon className={`w-4 h-4 mb-3 ${selectedService === 'due-diligence' ? 'text-champagne' : 'text-ivory/30'}`} strokeWidth={1.5} />
                              <div>
                                <div className="text-[11px] font-bold uppercase">Compliance Afrique</div>
                                <div className="text-[9px] opacity-75 mt-1 leading-normal">Due Diligence de probité avant fusion-acquisition ou implantation.</div>
                              </div>
                            </button>

                            <button 
                              onClick={() => setSelectedService('investigation')}
                              className={`p-4 rounded-xl border text-left transition-all flex flex-col justify-between ${
                                selectedService === 'investigation' 
                                  ? 'bg-[#0c121d] border-2 border-champagne text-ivory shadow-lg shadow-champagne/5' 
                                  : 'bg-obsidian/40 border border-champagne/15 text-ivory/60 hover:border-champagne/40 hover:text-ivory hover:shadow-md'
                              }`}
                            >
                              <SearchIcon className={`w-4 h-4 mb-3 ${selectedService === 'investigation' ? 'text-champagne' : 'text-ivory/30'}`} strokeWidth={1.5} />
                              <div>
                                <div className="text-[11px] font-bold uppercase">Investigation</div>
                                <div className="text-[9px] opacity-75 mt-1 leading-normal">Recherche de preuves juridiques, d'actifs, fraudes et délits civils.</div>
                              </div>
                            </button>

                            <button 
                              onClick={() => setSelectedService('orfa')}
                              className={`p-4 rounded-xl border text-left transition-all flex flex-col justify-between ${
                                selectedService === 'orfa' 
                                  ? 'bg-[#0c121d] border-2 border-champagne text-ivory shadow-lg shadow-champagne/5' 
                                  : 'bg-obsidian/40 border border-champagne/15 text-ivory/60 hover:border-champagne/40 hover:text-ivory hover:shadow-md'
                              }`}
                            >
                              <ActivityIcon className={`w-4 h-4 mb-3 ${selectedService === 'orfa' ? 'text-champagne' : 'text-ivory/30'}`} strokeWidth={1.5} />
                              <div>
                                <div className="text-[11px] font-bold uppercase">Gestion de Crise / ORFA</div>
                                <div className="text-[9px] opacity-75 mt-1 leading-normal">Optimisation mentale et décisionnelle des équipes sous haute pression.</div>
                              </div>
                            </button>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div>
                            <h3 className="text-xs font-serif font-semibold uppercase tracking-wider text-champagne mb-3">Degré d'urgence ?</h3>
                            <div className="space-y-2">
                              {['immediate', 'short-term', 'preventive'].map((level) => (
                                <button
                                  key={level}
                                  onClick={() => setUrgencyLevel(level)}
                                  className={`w-full p-3 rounded-lg border text-left text-xs transition-all flex items-center justify-between ${
                                    urgencyLevel === level 
                                      ? 'bg-[#0c121d] border-2 border-champagne text-champagne font-semibold shadow-lg shadow-champagne/5' 
                                      : 'bg-obsidian/40 border border-champagne/15 text-ivory/70 hover:border-champagne/40 hover:text-ivory'
                                  }`}
                                >
                                  <span>
                                    {level === 'immediate' && 'Urgence immédiate (Alerte)'}
                                    {level === 'short-term' && 'Mise en œuvre court terme (< 30 jours)'}
                                    {level === 'preventive' && 'Veille & prévention stratégique'}
                                  </span>
                                  {urgencyLevel === level && <CheckIcon className="w-3.5 h-3.5 text-champagne" />}
                                </button>
                              ))}
                            </div>
                          </div>

                          <div>
                            <h3 className="text-xs font-serif font-semibold uppercase tracking-wider text-champagne mb-3">Zone géographique concernée ?</h3>
                            <div className="space-y-2">
                              {['europe', 'west-africa', 'global'].map((zone) => (
                                <button
                                  key={zone}
                                  onClick={() => setGeography(zone)}
                                  className={`w-full p-3 rounded-lg border text-left text-xs transition-all flex items-center justify-between ${
                                    geography === zone 
                                      ? 'bg-[#0c121d] border-2 border-champagne text-champagne font-semibold shadow-lg shadow-champagne/5' 
                                      : 'bg-obsidian/40 border border-champagne/15 text-ivory/70 hover:border-champagne/40 hover:text-ivory'
                                  }`}
                                >
                                  <span>
                                    {zone === 'europe' && 'Europe / France'}
                                    {zone === 'west-africa' && 'Afrique de l\'Ouest (Sénégal, Côte d\'Ivoire, Niger...)'}
                                    {zone === 'global' && 'Transfrontalier / Autre zone'}
                                  </span>
                                  {geography === zone && <CheckIcon className="w-3.5 h-3.5 text-champagne" />}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="pt-4 border-t border-champagne/15 flex justify-end">
                          <button 
                            onClick={() => setBookingStep(2)}
                            className="bg-champagne text-obsidian border border-champagne px-6 py-2.5 rounded-full font-bold text-xs uppercase tracking-widest flex items-center gap-1.5 hover:bg-white hover:text-obsidian hover:border-white transition-all shimmer-btn"
                          >
                            Continuer vers le Calendrier <ChevronRightIcon className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    )}

                    {/* STEP 2: Interactive Booking Calendar */}
                    {bookingStep === 2 && (
                      <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {/* Calendar grid */}
                          <div>
                            <div className="flex items-center justify-between mb-4">
                              <h3 className="text-xs font-serif font-semibold uppercase tracking-wider text-champagne">Sélectionner un jour (Juin 2026)</h3>
                              <span className="font-mono text-[10px] text-champagne/60">JUIN 2026</span>
                            </div>
                            <div className="grid grid-cols-7 gap-1.5 text-center font-mono text-[10px] bg-[#05080c] p-4 border border-champagne/15 rounded-2xl">
                              {['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d, i) => (
                                <div key={i} className="text-champagne/40 font-bold py-1">{d}</div>
                              ))}
                              {/* Empty slots for offset if needed, Juin 2026 starts on a Monday */}
                              {daysInMonth.map((day) => {
                                const isWeekend = day % 7 === 6 || day % 7 === 0;
                                const isSelected = selectedDate === day;
                                return (
                                  <button
                                    key={day}
                                    disabled={isWeekend}
                                    onClick={() => {
                                      setSelectedDate(day);
                                      setSelectedTimeSlot(null); // Reset time selection on day change
                                    }}
                                    className={`py-2 rounded-md font-semibold transition-all ${
                                      isWeekend 
                                        ? 'text-ivory/15 cursor-not-allowed' 
                                        : isSelected 
                                          ? 'bg-champagne text-obsidian font-bold scale-105 shadow-md shadow-champagne/15' 
                                          : 'text-ivory/70 hover:bg-champagne/10 hover:text-champagne'
                                    }`}
                                  >
                                    {day}
                                  </button>
                                );
                              })}
                            </div>
                          </div>

                          {/* Time selection */}
                          <div>
                            <h3 className="text-xs font-serif font-semibold uppercase tracking-wider text-champagne mb-4 flex items-center gap-1.5">
                              <ClockIcon className="w-3.5 h-3.5 text-champagne" /> Créneaux disponibles pour le {selectedDate ? `${selectedDate} Juin` : '...'}
                            </h3>
                            {selectedDate ? (
                              <div className="space-y-2 max-h-48 overflow-y-auto pr-2">
                                {timeSlots.map((slot) => {
                                  const isSelected = selectedTimeSlot === slot;
                                  return (
                                    <button
                                      key={slot}
                                      onClick={() => setSelectedTimeSlot(slot)}
                                      className={`w-full py-2.5 rounded-lg border text-[11px] font-mono text-center transition-all ${
                                        isSelected 
                                          ? 'bg-[#0c121d] border-2 border-champagne text-champagne font-bold shadow-lg shadow-champagne/5' 
                                          : 'bg-obsidian/40 border border-champagne/15 text-ivory/70 hover:border-champagne/45 hover:text-champagne'
                                      }`}
                                    >
                                      {slot}
                                    </button>
                                  );
                                })}
                              </div>
                            ) : (
                              <div className="h-40 flex items-center justify-center border border-champagne/15 bg-[#05080c] rounded-2xl text-[10px] text-ivory/30 uppercase tracking-widest">
                                Sélectionnez un jour de semaine
                              </div>
                            )}
                          </div>
                        </div>

                        {/* Form fields for secure submission */}
                        {selectedDate && selectedTimeSlot && (
                          <form onSubmit={handleBookingSubmit} className="pt-4 border-t border-champagne/15 space-y-4">
                            <div className="flex items-center gap-2 bg-[#C5A880]/10 border border-[#C5A880]/20 px-4 py-2.5 rounded-xl text-[10px] text-[#C5A880] font-mono font-bold">
                              <LockIcon className="w-3.5 h-3.5" />
                              <span>INFORMATIONS SÉCURISÉES DE CONTACT (CONFIDENTIALITÉ OPJ)</span>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              <div>
                                <label className="block text-[9px] font-mono uppercase text-champagne/50 mb-1">Nom / Cabinet d'Affaires</label>
                                <input 
                                  type="text" 
                                  required
                                  placeholder="Ex: Cabinet de Sûreté Alpha" 
                                  value={contactInfo.name}
                                  onChange={(e) => setContactInfo({ ...contactInfo, name: e.target.value })}
                                  className="w-full bg-obsidian border border-champagne/15 rounded-xl px-4 py-2.5 text-xs text-ivory placeholder-ivory/35 focus:border-champagne focus:ring-1 focus:ring-champagne focus:outline-none transition-all"
                                />
                              </div>
                              <div>
                                <label className="block text-[9px] font-mono uppercase text-champagne/50 mb-1">Canal E-mail de Contact</label>
                                <input 
                                  type="email" 
                                  required
                                  placeholder="Ex: contact@direction-surete.com" 
                                  value={contactInfo.email}
                                  onChange={(e) => setContactInfo({ ...contactInfo, email: e.target.value })}
                                  className="w-full bg-obsidian border border-champagne/15 rounded-xl px-4 py-2.5 text-xs text-ivory placeholder-ivory/35 focus:border-champagne focus:ring-1 focus:ring-champagne focus:outline-none transition-all"
                                />
                              </div>
                            </div>
                          </form>
                        )}

                        {/* Footer buttons */}
                        <div className="pt-4 border-t border-champagne/15 flex justify-between">
                          <button 
                            onClick={() => setBookingStep(1)}
                            className="border border-champagne/30 text-ivory/75 hover:text-ivory px-5 py-2.5 rounded-full font-bold text-xs uppercase tracking-widest flex items-center gap-1.5 bg-obsidian transition-all"
                          >
                            <ChevronLeftIcon className="w-4 h-4" /> Retour
                          </button>
                          {selectedDate && selectedTimeSlot && (
                            <button 
                              onClick={handleBookingSubmit}
                              disabled={!contactInfo.name || !contactInfo.email}
                              className="bg-champagne text-obsidian border border-champagne px-6 py-2.5 rounded-full font-bold text-xs uppercase tracking-widest disabled:opacity-40 disabled:cursor-not-allowed hover:bg-white hover:text-obsidian hover:border-white transition-all shimmer-btn"
                            >
                              Confirmer le rendez-vous
                            </button>
                          )}
                        </div>
                      </div>
                    )}

                    {/* STEP 3: Success Screen */}
                    {bookingStep === 3 && (
                      <div className="py-10 text-center flex flex-col items-center justify-center gap-6">
                        <div className="w-14 h-14 bg-champagne/10 border border-champagne rounded-full flex items-center justify-center text-champagne animate-pulse">
                          <CheckIcon className="w-8 h-8" strokeWidth={1.5} />
                        </div>
                        
                        <div className="space-y-2">
                          <h3 className="text-lg font-serif uppercase tracking-[0.18em] text-champagne">Rendez-vous pré-enregistré</h3>
                          <p className="text-xs text-ivory/60 max-w-md mx-auto leading-relaxed font-light">
                            Votre demande a été cryptée et stockée de manière sécurisée sous secret professionnel. Le cabinet G. NEXUS reviendra vers vous sous 24 heures.
                          </p>
                        </div>

                        <div className="bg-[#05080c]/60 border border-[#C5A880]/15 rounded-2xl p-6 text-left w-full max-w-md font-mono text-[10px] space-y-2 text-ivory shadow-lg">
                          <div className="text-champagne font-bold border-b border-champagne/10 pb-2 mb-2">RÉSUMÉ DU MANDAT DE CONSULTATION</div>
                          <div><span className="text-ivory/40">CABINET :</span> {contactInfo.name}</div>
                          <div><span className="text-ivory/40">SERVICE :</span> {selectedService === 'due-diligence' ? 'Due Diligence Afrique' : selectedService === 'investigation' ? 'Investigation de Preuve' : 'Gestion de Crise / ORFA'}</div>
                          <div><span className="text-ivory/40">DATE & HEURE :</span> {selectedDate} Juin 2026 à {selectedTimeSlot} (Fuseau Paris)</div>
                          <div><span className="text-ivory/40">STATUT :</span> CRYPTÉ (SSL 256-BIT)</div>
                        </div>

                        <button 
                          onClick={closeBooking}
                          className="magnetic-btn shimmer-btn border border-champagne/30 text-ivory hover:bg-champagne hover:text-obsidian px-6 py-2 rounded-full font-bold text-xs uppercase tracking-widest mt-4 bg-obsidian transition-all"
                        >
                          Fermer l'interface
                        </button>
                      </div>
                    )}

                  </div>

                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
